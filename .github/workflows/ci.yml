
name: AgentOps Copilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build FAISS index
        env:
          APP_NAME: AgentOps Copilot
          APP_VERSION: 1.0.0
          ENVIRONMENT: test
          DEBUG: "false"
          LOG_LEVEL: INFO

          DATABASE_URL: sqlite:///./agentops_test.db

          RUNBOOKS_PATH: data/runbooks
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
          RAG_CHUNK_SIZE: "1800"
          RAG_CHUNK_OVERLAP: "200"

          LLM_PROVIDER: ollama
          LLM_BASE_URL: http://localhost:11434
          LLM_MODEL: qwen2.5:3b

          EXECUTOR_PROVIDER: simulated

          VECTOR_STORE_PROVIDER: faiss
          VECTOR_STORE_PATH: data/vector_store

          SEED_DATA_PATH: data/pipeline_runs.csv

        run: python -m app.rag.ingest

      - name: Run tests
        env:
          APP_NAME: AgentOps Copilot
          APP_VERSION: 1.0.0
          ENVIRONMENT: test
          DEBUG: "false"
          LOG_LEVEL: INFO

          DATABASE_URL: sqlite:///./agentops_test.db

          RUNBOOKS_PATH: data/runbooks
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
          RAG_CHUNK_SIZE: "1800"
          RAG_CHUNK_OVERLAP: "200"

          LLM_PROVIDER: ollama
          LLM_BASE_URL: http://localhost:11434
          LLM_MODEL: qwen2.5:3b

          EXECUTOR_PROVIDER: simulated

          VECTOR_STORE_PROVIDER: faiss
          VECTOR_STORE_PATH: data/vector_store

          SEED_DATA_PATH: data/pipeline_runs.csv

        run: python -m pytest tests/ -q